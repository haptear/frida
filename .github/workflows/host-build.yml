# 电脑端（host）同源构建 —— 可选，只有需要连"改了协议"的服务端时才用
#
# 为什么需要：names 组改了两处「两端协议」
#   D-Bus 名族  re.frida.*  -> io.sysd.*
#   RPC 前缀    frida:rpc   -> sysd:rpc
# 只改服务端、客户端仍用 pip 装的 frida，会握手失败（unexpected message）。
# 所以要用本 workflow 产出的同源 CLI。
#
# 无参数：点一下就跑，产出 _out_host/bin/* 与 lib/*.so*。
# ★ 未经实际运行验证；首次跑可能需要补系统依赖。

name: host-build

on:
  workflow_dispatch:

env:
  FRIDA_VERSION: '17.9.9'
  PATCH_GROUP: 'names+selinux-B'

jobs:
  host:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    env:
      FRIDA_DEPS: ${{ github.workspace }}/.deps
      MESON_BUILD_ROOT: ${{ github.workspace }}/.build

    steps:
      - name: Checkout with submodules
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
          path: frida-mg

      - name: System deps
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential ninja-build meson valac libglib2.0-dev python3 pkg-config curl git unzip zip file libssl-dev
          echo "meson: $(meson --version)"
          echo "valac(bootstrap): $(valac --version)"
          echo "ninja: $(ninja --version)"

      - name: Cache frida-vala
        id: vala-cache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.vala
          key: frida-vala-r29-v2

      - name: Build frida-vala
        if: steps.vala-cache.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 https://github.com/frida/vala.git
          cd vala
          meson setup _build --prefix="${{ github.workspace }}/.vala" --buildtype=release
          ninja -C _build
          ninja -C _build install

      - name: Wire frida-vala (PATH + LD_LIBRARY_PATH) and verify -frida suffix
        shell: bash
        run: |
          set -eu
          prefix="${{ github.workspace }}/.vala"
          codegen=$(find "$prefix" -type f -name 'libvalacodegen.so*' | head -n1)
          if [ -z "$codegen" ]; then echo "::error::libvalacodegen.so not found under $prefix"; exit 1; fi
          pkglibdir=$(dirname "$codegen")
          libdir=$(dirname "$pkglibdir")
          prev_ld="${LD_LIBRARY_PATH:-}"
          vala_ld="$pkglibdir:$libdir${prev_ld:+:$prev_ld}"
          export PATH="$prefix/bin:$PATH"
          export LD_LIBRARY_PATH="$vala_ld"
          v=$(valac --version)
          echo "valac=$v"
          echo "pkglibdir=$pkglibdir"
          echo "libdir=$libdir"
          case "$v" in *-frida*) echo OK ;; *) echo "::error::valac lacks -frida"; exit 1 ;; esac
          echo "$prefix/bin" >> $GITHUB_PATH
          echo "LD_LIBRARY_PATH=$vala_ld" >> $GITHUB_ENV

      - name: Apply same patches
        working-directory: frida-mg
        shell: bash
        run: |
          set -eu
          P="$PWD/_stealth/patches"
          # frida-core 的 lib/agent/frida-agent.def 在仓库里是 CRLF（git ls-files --eol = i/crlf），
          # 而补丁上下文是 LF；Linux runner 不做换行转换，直接 apply 会 "patch does not apply"。
          # 把补丁涉及的文件统一成 LF（本来就是 LF 的文件为 no-op）。
          for patch in "$P"/*.patch; do
            sed -n 's|^+++ b/||p' "$patch" | sort -u
          done | while IFS= read -r f; do
            if [ "$f" = "/dev/null" ]; then continue; fi
            for sub in frida-core frida-gum; do
              if [ -f "subprojects/$sub/$f" ]; then sed -i 's/\r$//' "subprojects/$sub/$f"; fi
            done
          done
          echo ""
          git -C subprojects/frida-core apply "$P/names-core.patch"
          git -C subprojects/frida-gum apply "$P/names-gum.patch"
          python3 "$P/apply-dedetect.py" --root subprojects/frida-core --apply | tail -5
          git -C subprojects/frida-core apply "$P/selinux-B-rename-types.patch"
          git -C subprojects/frida-core apply "$P/selinux-B2-label-sites.patch"

      - name: Configure for linux host
        working-directory: frida-mg
        shell: bash
        run: |
          ./configure --prefix="${{ github.workspace }}/_out_host" --host=linux-x86_64 -- \
            -Dfrida-core:frida_version=${{ env.FRIDA_VERSION }}

      - name: Make
        working-directory: frida-mg
        shell: bash
        run: make -j$(nproc)

      - name: Install
        working-directory: frida-mg
        shell: bash
        run: make install

      - name: Show what got built
        shell: bash
        run: |
          echo "--- bin ---"
          ls -l _out_host/bin || true
          echo "--- lib ---"
          ls -l _out_host/lib || true

      - name: Upload host CLI
        uses: actions/upload-artifact@v4
        with:
          name: host-cli
          path: |
            _out_host/bin/*
            _out_host/lib/*.so*
          if-no-files-found: warn
